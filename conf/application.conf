include "frontend.conf"

appName="crs-fatca-reporting-frontend"

play.http.router = prod.Routes

play.http.errorHandler = "handlers.ErrorHandler"

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"
play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
play.modules.enabled += "config.Module"

play.filters.enabled += play.filters.csp.CSPFilter

play.i18n.langs = ["en"]

microservice {
    services {
      auth {
        protocol = http
        host     = localhost
        port     = 8500
      }
      crs-fatca-reporting {
        protocol = http
        host     = localhost
        port     = 10037
      }
      upscan {
        host = localhost
        port = 9570
        protocol = http
        redirect-base = "http://localhost:10038"
        callbackDelayInSeconds = 2
        max-file-size-in-mb = 100
        max-file-name-length = 170
      }
      feedback-frontend {
        protocol = http
        host     = localhost
        port     = 9514
      }
    }
}

contact-frontend {
  host      = "http://localhost:9250"
  serviceId = "report-for-crs-and-fatca"
}

# please update this counter as multiple of 3 seconds
spinner.counter = 4

timeout-dialog {
  timeout   = 900
  countdown = 120
}

session {
  timeoutSeconds = 900
}

mongodb {
  uri                 = "mongodb://localhost:27017/"${appName}
  timeToLiveInSeconds = 900
}

urls {
  login         = "http://localhost:9949/auth-login-stub/gg-sign-in"
  loginContinue = "http://localhost:10038/report-for-crs-and-fatca"
  emailEnquiries = "aeoi.enquiries@hmrc.gov.uk"
  signOut       = "http://localhost:9553/bas-gateway/sign-out-without-state"
  manageFI = "http://localhost:10033/manage-your-crs-and-fatca-financial-institutions"
  yourFIs = "http://localhost:10033/manage-your-crs-and-fatca-financial-institutions/?goToYourFIs=true"
  register      = "http://localhost:10030/register-for-crs-and-fatca"
  manageSubmission  = "http://localhost:10039/crs-fatca-manual-submission-frontend"
}

keys {
    enrolmentKey.crsFatca = "HMRC-FATCA-ORG"
    enrolmentKey.ct       = "IR-CT"
}

host = "http://localhost:10038"

accessibility-statement{
  service-path = "/report-for-crs-and-fatca"
}

tracking-consent-frontend {
  gtm.container = "transitional"
}

play-frontend-hmrc {
    useRebrand = true
}


features {
  welsh-translation: false
}